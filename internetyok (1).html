<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="İnternet bağlantısı yok - Hayal Ağacı Derneği">
    <title>Bağlantı Koptu - Hayal Ağacı Derneği</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Yumuşak Gece/Gündüz Geçişi */
        body, .hata-kapsayici, .hata-mesaj, .hata-aciklama {
            transition: background-color 0.8s ease, color 0.8s ease, text-shadow 0.8s ease !important;
        }

        .hata-kapsayici {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; 
            background-color: rgb(254, 249, 241);
            text-align: center;
            padding: 20px;
            box-sizing: border-box; 
        }

        .hata-kodu {
            font-size: 6rem;
            font-weight: bold;
            color: #d9534f;
            margin: 0;
            line-height: 1;
            text-shadow: 4px 4px 10px rgba(0, 0, 0, 0.1);
            text-transform: uppercase;
        }

        .hata-mesaj {
            font-size: 2.5rem;
            color: rgb(27, 27, 27);
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .hata-aciklama {
            font-size: 1.2rem;
            color: rgb(80, 80, 80);
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        @media (max-width: 900px) {
            .hata-kapsayici img { width: 100px !important; margin-bottom: 10px !important; }
            .hata-kodu { font-size: 4rem; }
            .hata-mesaj { font-size: 1.8rem; }
            .hata-aciklama { font-size: 1rem; padding: 0 10px; margin-bottom: 25px; }
            .hata-kapsayici .katılbt { width: 80% !important; max-width: 300px; padding: 15px !important; font-size: 1.2rem !important; }
        }

        /* Karanlık Mod Uyumu */
        body.dark-mode .hata-kapsayici { background-color: #121212 !important; }
        body.dark-mode .hata-mesaj { color: #f5f5f5 !important; }
        body.dark-mode .hata-aciklama { color: #ccc !important; }
    </style>
</head>
<body>
    <div class="hata-kapsayici">
        <img src="source/ha/ha_logo_lr.png" alt="Hayal Ağacı Logo" style="width: 150px; margin-bottom: 20px;">
        
        <h1 class="hata-kodu">Bağlantı Yok</h1>
        <h2 class="hata-mesaj">İnternetiniz Gitti</h2>
        <p class="hata-aciklama">
            Şu anda çevrimdışısınız efendim. Ancak endişelenmeyin, internet bağlantınız geri geldiğinde sayfa otomatik olarak yenilenecektir.
        </p>
        
        <button onclick="window.location.reload()" class="katılbt" style="cursor:pointer; border:none; display: flex; align-items: center; justify-content: center; position: static; margin: 0 auto;">
            Tekrar Dene
        </button>
    </div>

    <script>
        // İnternet geri geldiğinde sayfayı otomatik yeniler
        window.addEventListener('online', function() {
            window.location.reload();
        });
    </script>
</body>
</html>
