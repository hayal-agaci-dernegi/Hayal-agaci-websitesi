<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="İnternet bağlantısı yok - Hayal Ağacı Derneği">
    <title>Bağlantı Koptu - Hayal Ağacı Derneği</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        body, .hata-kapsayici, .hata-mesaj, .hata-aciklama {
            transition: background-color 0.8s ease, color 0.8s ease, text-shadow 0.8s ease !important;
        }

        .hata-kapsayici {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; 
            background-color: rgb(254, 249, 241);
            text-align: center;
            padding: 20px;
            box-sizing: border-box; 
        }

        .hata-mesaj {
            font-size: 1.8rem;
            color: rgb(27, 27, 27);
            margin-top: 15px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .hata-aciklama {
            font-size: 1rem;
            color: rgb(100, 100, 100);
            max-width: 500px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        @media (max-width: 900px) {
            .hata-kapsayici img { width: 80px !important; }
            .hata-mesaj { font-size: 1.4rem; }
            .hata-aciklama { font-size: 0.9rem; }
        }

        body.dark-mode .hata-kapsayici { background-color: #121212 !important; }
        body.dark-mode .hata-mesaj { color: #f5f5f5 !important; }
        body.dark-mode .hata-aciklama { color: #aaa !important; }
    </style>
</head>
<body>
    <div class="hata-kapsayici">
        <img src="source/ha/ha_logo_lr.png" alt="Hayal Ağacı Logo" style="width: 110px; margin-bottom: 15px;">
        
        <h2 class="hata-mesaj">İnternet Bağlantınız Kesildi</h2>
        <p class="hata-aciklama">
            Şu anda çevrimdışısınız gibi görünüyor. Lütfen internet bağlantınızı kontrol edin veya bağlantı yeniden sağlandığında sayfayı yenileyin.
        </p>

        <button onclick="window.location.reload()" class="bagisbt" style="cursor:pointer; padding: 12px 25px; font-size: 1rem; position: static;">Yeniden Dene</button>
    </div>

    <script>
        // İnternet geri geldiğinde sayfayı otomatik yenile
        window.addEventListener('online', function() {
            window.location.reload();
        });
    </script>
</body>
</html>
