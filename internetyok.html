<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="İnternet bağlantısı yok - Hayal Ağacı Derneği">
    <title>Bağlantı Koptu - Hayal Ağacı Derneği</title>
    
    <!-- Sekmedeki dünya simgesi yerine logonuzun çıkmasını sağlayan kısım -->
    <link rel="icon" type="image/png" href="source/ha/ha_logo_192.png">
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        body, .hata-kapsayici, .hata-mesaj, .hata-aciklama {
            transition: background-color 0.8s ease, color 0.8s ease, text-shadow 0.8s ease !important;
        }

        .hata-kapsayici {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; 
            background-color: rgb(254, 249, 241);
            text-align: center;
            padding: 20px;
            box-sizing: border-box; 
        }

        /* İnternet yokken logoyu tamamen gri yapan kısım */
        #durum-logo {
            width: 110px;
            margin-bottom: 15px;
            filter: grayscale(100%);
            transition: filter 0.6s ease;
        }

        /* İnternet geldiğinde logonun rengini geri getiren sınıf */
        #durum-logo.renkli {
            filter: grayscale(0%);
        }

        .hata-mesaj {
            font-size: 1.8rem;
            color: rgb(27, 27, 27);
            margin-top: 15px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .hata-aciklama {
            font-size: 1rem;
            color: rgb(100, 100, 100);
            max-width: 500px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        @media (max-width: 900px) {
            #durum-logo { width: 80px !important; }
            .hata-mesaj { font-size: 1.4rem; }
            .hata-aciklama { font-size: 0.9rem; }
        }

        body.dark-mode .hata-kapsayici { background-color: #121212 !important; }
        body.dark-mode .hata-mesaj { color: #f5f5f5 !important; }
        body.dark-mode .hata-aciklama { color: #aaa !important; }
    </style>
</head>
<body>
    <div class="hata-kapsayici">
        <img src="source/ha/ha_logo_lr.png" alt="Hayal Ağacı Logo" id="durum-logo">
        
        <h2 class="hata-mesaj">İnternet Bağlantınız Kesildi</h2>
        <p class="hata-aciklama">
            Şu anda çevrimdışısınız gibi görünüyor. Lütfen internet bağlantınızı kontrol edin veya bağlantı yeniden sağlandığında sayfayı yenileyin.
        </p>

        <button onclick="window.location.reload()" class="bagisbt" style="cursor:pointer; padding: 12px 25px; font-size: 1rem; position: static;">Yeniden Dene</button>
    </div>

    <script>
        // İnternet geri geldiğinde çalışacak komutlar
        window.addEventListener('online', function() {
            // Logoya rengini geri ver
            document.getElementById('durum-logo').classList.add('renkli');
            
            // Rengin geldiği görülsün diye yarım saniye bekleyip sayfayı yenile
            setTimeout(function() {
                window.location.reload();
            }, 500);
        });
    </script>
</body>
</html>
