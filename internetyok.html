<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="İnternet bağlantısı yok - Hayal Ağacı Derneği">
    <title>Bağlantı Koptu - Hayal Ağacı Derneği</title>
    
    <!-- Sekmedeki dünya simgesi yerine logonuzun çıkmasını sağlayan kısım -->
    <link rel="icon" type="image/png" href="source/ha/ha_logo_192.png">
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Animasyonlu pürüzsüz renk geçişleri */
        body, .hata-kapsayici, .hata-mesaj, .hata-aciklama, #durum-logo, .bagisbt {
            transition: background-color 0.8s ease, color 0.8s ease, filter 0.8s ease, border 0.8s ease !important;
        }

        .hata-kapsayici {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; 
            background-color: rgb(254, 249, 241);
            text-align: center;
            padding: 20px;
            box-sizing: border-box; 
        }

        /* İnternet yokken logoyu tamamen gri yapan kısım */
        #durum-logo {
            width: 110px;
            margin-bottom: 15px;
            filter: grayscale(100%);
        }

        /* İnternet geldiğinde logonun rengini geri getiren sınıf */
        #durum-logo.renkli {
            filter: grayscale(0%);
        }

        .hata-mesaj {
            font-size: 1.8rem;
            color: rgb(27, 27, 27);
            margin-top: 15px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .hata-aciklama {
            font-size: 1rem;
            color: rgb(100, 100, 100);
            max-width: 500px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        @media (max-width: 900px) {
            #durum-logo { width: 80px !important; }
            .hata-mesaj { font-size: 1.4rem; }
            .hata-aciklama { font-size: 0.9rem; }
        }

        /* ================= KUSURSUZ KARANLIK MOD STİLLERİ ================= */
        body.dark-mode .hata-kapsayici { 
            background-color: #121212 !important; 
        }
        body.dark-mode .hata-mesaj { 
            color: #f5f5f5 !important; 
        }
        body.dark-mode .hata-aciklama { 
            color: #aaa !important; 
        }
        body.dark-mode .bagisbt {
            background-color: #1e1e1e !important;
            color: #f5f5f5 !important;
            border: 1px solid #444 !important;
        }
    </style>
</head>
<body>
    <div class="hata-kapsayici">
        <img src="source/ha/ha_logo_lr.png" alt="Hayal Ağacı Logo" id="durum-logo">
        
        <h2 class="hata-mesaj">İnternet Bağlantınız Kesildi</h2>
        <p class="hata-aciklama">
            Şu anda çevrimdışısınız gibi görünüyor. Lütfen internet bağlantınızı kontrol edin veya bağlantı yeniden sağlandığında sayfayı yenileyin.
        </p>

        <button onclick="window.location.reload()" class="bagisbt" style="cursor:pointer; padding: 12px 25px; font-size: 1rem; position: static;">Yeniden Dene</button>
    </div>

    <script>
        // 1. ANA SİTEYE BAĞLI VE SAATE GÖRE OTOMATİK KARANLIK MOD ALGORİTMASI
        function temaKontroluYap() {
            // Ana sitenizden gelen localStorage verisini okuruz
            const kayitliTema = localStorage.getItem("tema");
            const guncelSaat = new Date().getHours();
            const body = document.body;

            if (kayitliTema === "dark") {
                // Kullanıcı sitede karanlık modu seçmişse buna uyarız
                body.classList.add("dark-mode");
            } else if (kayitliTema === "light") {
                // Kullanıcı aydınlık modu seçmişse buna uyarız
                body.classList.remove("dark-mode");
            } else {
                // Herhangi bir seçim yapılmamışsa saati kontrol edip göz koruması uygularız (Akşam 7 ile Sabah 7 arası)
                if (guncelSaat >= 19 || guncelSaat < 7) {
                    body.classList.add("dark-mode");
                }
            }
        }

        // Sayfa ilk yüklendiğinde temayı hemen ayarla
        temaKontroluYap();

        // 2. İNTERNET GERİ GELDİĞİNDE TETİKLENEN YAPI
        window.addEventListener('online', function() {
            // Logoya rengini pürüzsüz bir animasyonla geri ver
            document.getElementById('durum-logo').classList.add('renkli');
            
            // Kullanıcının bağlantının geldiğini logodaki renkten anlaması için yarım saniye bekleyip yenile
            setTimeout(function() {
                window.location.reload();
            }, 500);
        });
    </script>
</body>
</html>
